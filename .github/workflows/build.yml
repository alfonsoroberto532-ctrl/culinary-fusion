# Build Android APK for Culinary Fusion (generates APK and uploads artifacts)
# - No signing (unsigned APK) so no secrets required
# - Uses subosito/flutter-action@v2 with channel input to avoid the "Unable to determine Flutter version" error
name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLUTTER_CHANNEL: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Cache Pub (Dart/Flutter packages)
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Accept Android SDK licenses
        # subosito/flutter-action installs Android SDK; accepting licenses avoids interactive prompt
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK (release)
        run: |
          flutter clean
          # Build a single release APK (unsigned). If you want AAB, replace with `flutter build appbundle --release`.
          flutter build apk --release

      - name: Show build output (diagnostic)
        run: |
          echo "Listing Android build outputs:"
          ls -la build/app || true
          ls -la build/app/outputs || true
          ls -la build/app/outputs/flutter-apk || true
          echo "Listing potential symbol outputs:"
          ls -la build/app/outputs/symbols || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: culinary-fusion-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload native symbols (if any)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-symbols
          path: build/app/outputs/symbols/**

      - name: Upload full build folder for debugging
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-build-folder
          path: build/**

      - name: Done
        run: echo "Build job finished. Check artifacts in the workflow run."