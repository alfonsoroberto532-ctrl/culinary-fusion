# Build Android APK for Culinary Fusion
# - Produces APK(s) under build/app/outputs/flutter-apk/
# - Uploads APK(s) as artifact and uploads native symbols if present
# - Uses actions/setup-java@v5 and subosito/flutter-action@v2
name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Asegúrate de configurar estas secrets si vas a firmar el APK para Play Store:
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      # Si no las tienes, el APK será unsigned (útil para pruebas).
      # Example use is commented later in the signing step.
      FLUTTER_CHANNEL: stable

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}

      - name: Cache Pub (Dart/Flutter packages)
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: stable

      - name: Flutter --version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Optional: restore keystore from a secret if you want to produce a signed release APK.
      # Uncomment and configure secrets if you want signing.
      #
      # - name: Restore keystore (optional, for signed APK)
      #   if: secrets.KEYSTORE_BASE64 != ''
      #   run: |
      #     echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload.keystore
      #     mkdir -p ~/.android
      #     # configure gradle properties that the android/signing config in your app reads
      #     echo "RELEASE_STORE_FILE=android/app/upload.keystore" >> $GITHUB_ENV
      #     echo "RELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
      #     echo "RELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
      #     echo "RELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Accept Android SDK licenses (safe no-op if SDK already accepts)
        run: |
          yes | sdkmanager --licenses || true

      - name: Build APK (release)
        run: |
          # Clean to avoid stale artifacts
          flutter clean
          # Build release APK. This produces build/app/outputs/flutter-apk/app-release.apk (or app-arm64-v8a-release.apk if split-per-abi used)
          flutter build apk --release

      - name: Show build output (diagnostic)
        run: |
          echo "Listing Android build outputs:"
          ls -la build/app || true
          ls -la build/app/outputs || true
          ls -la build/app/outputs/flutter-apk || true
          echo "Listing potential symbol outputs:"
          ls -la build/app/outputs/symbols || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: culinary-fusion-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Upload native symbols (if any)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-symbols
          path: build/app/outputs/symbols/**

      - name: Upload full build folder for debugging
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-build-folder
          path: build/**

      - name: Done
        run: echo "Build job finished. Check artifacts in the workflow run."