name: Build & Obfuscate

on:
  push:
    branches: [ main ] [origin]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── CHECKOUT ─────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── JAVA ─────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── FLUTTER ──────────────────────────────────────
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # ── GOOGLE SERVICES ──────────────────────────────
      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo $GOOGLE_SERVICES_JSON > android/app/google-services.json

      # ── DEPENDENCIAS ─────────────────────────────────
      - name: Install dependencies
        run: flutter pub get

      # ── ANALYZE ──────────────────────────────────────
      - name: Analyze project
        run: flutter analyze

      # ── BUILD APK RELEASE ────────────────────────────
      - name: Build Obfuscated APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/varanova-hostal.apk

      # ── APK ARTIFACT ─────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaraNova-hostal-APK
          path: build/app/outputs/flutter-apk/varanova-hostal.apk

      # ── SYMBOLS ARTIFACT ─────────────────────────────
      - name: Upload Symbols
        uses: actions/upload-artifact@v4
        with:
          name: VaraNovaPro-Symbols
          path: build/app/outputs/symbols