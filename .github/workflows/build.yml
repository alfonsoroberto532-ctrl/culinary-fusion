name: Build & Obfuscate

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Flutter
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Dependencias
      - name: Install dependencies
        run: flutter pub get

      # Analyze
      - name: Analyze project
        run: flutter analyze

      # Build APK release ofuscado
      - name: Build Obfuscated APK
        run: |
          mkdir -p build/app/outputs/symbols
          flutter build apk --release \
            --obfuscate \
            --split-debug-info=build/app/outputs/symbols
          mv build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/varanova-hostal.apk

      # APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VaraNova-Hostal-APK
          path: build/app/outputs/flutter-apk/varanova-hostal.apk

      # Symbols artifact
      - name: Upload Symbols
        uses: actions/upload-artifact@v4
        with:
          name: VaraNova-Symbols
          path: build/app/outputs/symbols