name: varanova_hostal
description: "VaraNova Hostal — gestión integral de hostales y casas de renta (habitaciones, reservas, huéspedes, finanzas, suministros y operaciones)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Base de datos local SQLite (mismo patrón que VaraNova Restaurante / GestorV)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

  # Formato de fechas, monedas y localización
  intl: ^0.19.0

  # Gráficas de la pantalla de Estadísticas
  fl_chart: ^0.69.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icon/appicon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/appicon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/varanova.png"
  min_sdk_android: 21